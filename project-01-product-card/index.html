<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product-card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="product-card">
        <figure class="product-card__figure">
            <img src="prod-aks.jpg" alt="black leather wallet" class="product-card__image">
        </figure>
        <div class="product-card__info">
          <h2 class="product-card__title">product Name</h2>
          <p class="product-card__description"> this product description </p>
          <span class="product-card__price">price:500$</span> 
          <button type="button" class="product-card__button">Add to card</button>
        </div>
        
    </section>
 <script src="script.js"></script>   
</body>
</html>
