<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="products-container"></main>

    <template id="product-card-template">
        <section class="product-card">
            <figure class="product-card__figure">
                <img class="product-card__image" src="" alt="">
            </figure>

            <div class="product-card__thumbnails"></div>

            <div class="product-card__info">
                <h2 class="product-card__title"></h2>
                <p class="product-card__description"></p>
                <span class="product-card__price"></span>
                <button type="button" class="product-card__button">Add to cart</button>
                
            </div>

            <div class="product-card__option">
                <span class="options-label">Color:</span>
                <div class="color-options"></div>
            </div>
        </section>
    </template>

    <script src="script.js" defer></script>
</body>
</html>
